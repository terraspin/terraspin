name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.8.0

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Test
        run: go test -shuffle=on -coverprofile=coverage.out ./...

      - name: Test with race detector
        run: go test -race -shuffle=on ./...
        env:
          CGO_ENABLED: 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build -ldflags="-s -w" ./cmd/terraspin/

      - name: Run without config
        run: |
          go build -o "$RUNNER_TEMP/terraspin" ./cmd/terraspin
          mkdir "$RUNNER_TEMP/terraspin-clean"
          cd "$RUNNER_TEMP/terraspin-clean"
          "$RUNNER_TEMP/terraspin" "$GITHUB_WORKSPACE/testdata/plan.json"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true

      - name: govulncheck
        # Dependabot does not update tool versions embedded in run commands; review manually.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
