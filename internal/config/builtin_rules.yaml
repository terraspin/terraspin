rules:
  - id: AWS-SG-001
    severity: critical
    description: SSH is open to the internet.
    remediation: Restrict SSH access to trusted CIDR ranges.
    match:
      resource_type_pattern: aws_security_group
      attribute_path: ingress[*].cidr_blocks
      contains: 0.0.0.0/0
      attribute_path_2: ingress[*].from_port
      value_2: 22
  - id: AWS-SG-002
    severity: critical
    description: RDP is open to the internet.
    remediation: Restrict RDP access to trusted CIDR ranges.
    match:
      resource_type_pattern: aws_security_group
      attribute_path: ingress[*].cidr_blocks
      contains: 0.0.0.0/0
      attribute_path_2: ingress[*].from_port
      value_2: 3389
  - id: AWS-SG-003
    severity: critical
    description: All network protocols are open to the internet.
    remediation: Limit security group ingress to required protocols and trusted CIDR ranges.
    match:
      resource_type_pattern: aws_security_group
      attribute_path: ingress[*].cidr_blocks
      contains: 0.0.0.0/0
      attribute_path_2: ingress[*].protocol
      value_2: "-1"
  - id: AWS-SG-004
    severity: critical
    description: SSH is open to the IPv6 internet.
    remediation: Restrict SSH access to trusted IPv6 CIDR ranges.
    match:
      resource_type_pattern: aws_security_group
      attribute_path: ingress[*].ipv6_cidr_blocks
      contains: ::/0
      attribute_path_2: ingress[*].from_port
      value_2: 22
  - id: AWS-RDS-001
    severity: high
    description: An RDS instance is publicly accessible.
    remediation: Set publicly_accessible to false unless public database access is required.
    match:
      resource_type_pattern: aws_db_instance
      attribute_path: publicly_accessible
      value: true
  - id: AWS-RDS-002
    severity: high
    description: An RDS instance does not enable storage encryption.
    remediation: Set storage_encrypted to true for the RDS instance.
    match:
      resource_type_pattern: aws_db_instance
      attribute_path: storage_encrypted
      value: false
  - id: AWS-RDS-003
    severity: medium
    description: An RDS instance does not enable deletion protection.
    remediation: Set deletion_protection to true for the RDS instance.
    match:
      resource_type_pattern: aws_db_instance
      attribute_path: deletion_protection
      value: false
  - id: AWS-EBS-001
    severity: medium
    description: An EBS volume does not enable encryption.
    remediation: Set encrypted to true for the EBS volume.
    match:
      resource_type_pattern: aws_ebs_volume
      attribute_path: encrypted
      value: false
  - id: AWS-KMS-001
    severity: medium
    description: A KMS key does not enable automatic rotation.
    remediation: Set enable_key_rotation to true for the KMS key.
    match:
      resource_type_pattern: aws_kms_key
      attribute_path: enable_key_rotation
      value: false
  - id: AWS-SG-005
    severity: critical
    description: A security group ingress rule exposes SSH to IPv4 internet.
    remediation: Restrict SSH to trusted IPv4 CIDR ranges.
    match:
      resource_type_pattern: aws_vpc_security_group_ingress_rule
      attribute_path: cidr_ipv4
      value: 0.0.0.0/0
      attribute_path_2: from_port
      value_2: 22
  - id: AWS-SG-006
    severity: critical
    description: A security group ingress rule exposes RDP to IPv4 internet.
    remediation: Restrict RDP to trusted IPv4 CIDR ranges.
    match:
      resource_type_pattern: aws_vpc_security_group_ingress_rule
      attribute_path: cidr_ipv4
      value: 0.0.0.0/0
      attribute_path_2: from_port
      value_2: 3389
  - id: AWS-SG-007
    severity: critical
    description: A security group ingress rule exposes all protocols to IPv4 internet.
    remediation: Limit ingress to required protocols and trusted IPv4 CIDR ranges.
    match:
      resource_type_pattern: aws_vpc_security_group_ingress_rule
      attribute_path: cidr_ipv4
      value: 0.0.0.0/0
      attribute_path_2: ip_protocol
      value_2: "-1"
  - id: AWS-SG-008
    severity: critical
    description: A security group ingress rule exposes SSH to IPv6 internet.
    remediation: Restrict SSH to trusted IPv6 CIDR ranges.
    match:
      resource_type_pattern: aws_vpc_security_group_ingress_rule
      attribute_path: cidr_ipv6
      value: ::/0
      attribute_path_2: from_port
      value_2: 22
  - id: AWS-S3-001
    severity: high
    description: An S3 public access block permits public bucket policies.
    remediation: Enable block_public_policy and restrict_public_buckets.
    match:
      resource_type_pattern: aws_s3_bucket_public_access_block
      attribute_path: block_public_policy
      value: false
      attribute_path_2: restrict_public_buckets
      value_2: false
  - id: AWS-S3-002
    severity: high
    description: An S3 bucket policy allows every principal.
    remediation: Restrict the bucket policy principal to trusted identities.
    match:
      resource_type_pattern: aws_s3_bucket_policy
      attribute_path: policy
      contains: '"Principal":"*"'
      attribute_path_2: policy
      contains_2: '"Effect":"Allow"'
  - id: AWS-IAM-001
    severity: critical
    description: An IAM policy allows every action on every resource.
    remediation: Scope IAM actions and resources to the minimum required permissions.
    match:
      resource_type_pattern: aws_iam_*policy
      attribute_path: policy
      contains: '"Action":"*"'
      attribute_path_2: policy
      contains_2: '"Resource":"*"'
  - id: AWS-IAM-002
    severity: critical
    description: An IAM role trust policy allows every principal.
    remediation: Restrict the role trust policy to trusted principals.
    match:
      resource_type_pattern: aws_iam_role
      attribute_path: assume_role_policy
      contains: '"Principal":"*"'
  - id: AWS-IAM-003
    severity: critical
    description: An IAM role trust policy allows every AWS principal.
    remediation: Restrict the role trust policy to trusted AWS principals.
    match:
      resource_type_pattern: aws_iam_role
      attribute_path: assume_role_policy
      contains: '"AWS":"*"'
  - id: AWS-EKS-001
    severity: high
    description: An EKS public endpoint allows internet access.
    remediation: Restrict public_access_cidrs or disable endpoint_public_access.
    match:
      resource_type_pattern: aws_eks_cluster
      attribute_path: vpc_config[0].endpoint_public_access
      value: true
      attribute_path_2: vpc_config[0].public_access_cidrs
      contains_2: 0.0.0.0/0
